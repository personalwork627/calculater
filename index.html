<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 320px;
            padding: 20px;
            border-radius: 20px;
            background: #182433;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        h2 {
            text-align: center;
            color: white;
            margin-top: 0;
        }

        #display {
            width: 100%;
            height: 75px;
            margin-bottom: 15px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #eaf1f8;
            color: #111;
            font-size: 30px;
            text-align: right;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            cursor: pointer;
            background: #304257;
            color: white;
            transition: 0.15s;
        }

        button:hover {
            filter: brightness(1.25);
        }

        .operator {
            background: #ff9f43;
            color: #111;
        }

        .clear {
            background: #ff5c5c;
        }

        .equal {
            background: #20bf6b;
            color: #111;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <h2>My Calculator</h2>

        <input type="text" id="display"
               value="0" readonly aria-label="Calculator display"
               aria-live="polite">

        <div class="buttons">
            <button class="clear" data-action="clear">AC</button>
            <button data-action="delete">DEL</button>
            <button class="operator" data-value="%">%</button>
            <button class="operator" data-value="/">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="*">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="-">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="+">+</button>

            <button data-action="sign">+/−</button>
            <button class="zero" data-value="0">0</button>
            <button data-value=".">.</button>

            <button class="equal" data-action="calculate"
                    style="grid-column: span 4;">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById("display");
        let expression = "";
        let finished = false;

        function update() {
            display.value = expression || "0";
        }

        function addValue(value) {
            if (finished) {
                expression = "";
                finished = false;
            }

            if ("+-*/%".includes(value)) {
                if (!expression && value !== "-") return;

                if (/[+\-*/%]$/.test(expression)) {
                    expression = expression.slice(0, -1);
                }
            }

            expression += value;
            update();
        }

        function clearAll() {
            expression = "";
            finished = false;
            update();
        }

        function deleteLast() {
            expression = expression.slice(0, -1);
            finished = false;
            update();
        }

        function changeSign() {
            if (!expression) return;

            if (/^-?\d*\.?\d+$/.test(expression)) {
                expression = expression.startsWith("-")
                    ? expression.slice(1)
                    : "-" + expression;
                update();
            }
        }

        function calculate() {
            if (!expression) return;

            try {
                if (!/^[0-9+\-*/%.()\s]+$/.test(expression)) {
                    throw new Error("Invalid");
                }

                const result = Function(
                    '"use strict"; return (' + expression + ')'
                )();

                if (!Number.isFinite(result)) {
                    throw new Error("Invalid");
                }

                expression = String(
                    Number(result.toPrecision(12))
                );
                finished = true;
                update();
            } catch {
                display.value = "Invalid";
                expression = "";
                finished = true;
            }
        }

        document.querySelectorAll("button").forEach(button => {
            button.addEventListener("click", () => {
                const action = button.dataset.action;
                const value = button.dataset.value;

                if (action === "clear") clearAll();
                else if (action === "delete") deleteLast();
                else if (action === "sign") changeSign();
                else if (action === "calculate") calculate();
                else addValue(value);
            });
        });

        document.addEventListener("keydown", event => {
            if (/^[0-9.]$/.test(event.key)) addValue(event.key);
            else if ("+-*/%".includes(event.key)) addValue(event.key);
            else if (event.key === "Enter" || event.key === "=") calculate();
            else if (event.key === "Backspace") deleteLast();
            else if (event.key === "Escape") clearAll();
        });
    </script>

</body>
</html>
